[project]
name = "briefcase"
version = "0.1.0"
description = "A local, source-grounded notebook assistant (NotebookLM-style), built on ideas from Project Pragya."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdown-it-py>=3.0",
    "python-docx>=1.1",
    "python-pptx>=0.6",
]

[project.optional-dependencies]
# Better semantic embeddings (downloads a small local model).
semantic = ["sentence-transformers>=2.6"]
# Google Gemini for synthesized answers and embeddings.
gemini = ["google-genai>=0.3"]
# OCR for scanned / image-only PDFs and image files (needs poppler for pdf2image).
ocr = ["rapidocr-onnxruntime>=1.2", "pdf2image>=1.17"]
# Everything.
full = [
    "google-genai>=0.3",
    "rapidocr-onnxruntime>=1.2",
    "pdf2image>=1.17",
]

[project.scripts]
briefcase = "briefcase.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["briefcase*"]
